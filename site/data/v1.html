<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: tek sütun çalışma masası — üstte sabit sekmeler, altında bölüm çipleri ve seçili görünüm */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#13201C; --muted:#56665F; --line:#D5DED9;
  --accent:#0D6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEEE7;
  --good:#1D7444; --good-soft:#E1F1E6; --bad:#A93A2B; --bad-soft:#F7E4E0;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Header */
header .wrap{padding-block:22px 14px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.brand h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:800}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.total{min-width:200px;flex:0 1 260px}
.total .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.total .row b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Tabs */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{padding-block:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;max-width:420px}
.tabs a{display:block;text-align:center;padding:8px 6px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* Section chips */
.chips{display:grid;gap:10px;padding-block:16px 4px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.glabel{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:118px}
.secsel{display:none;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600}
@media (max-width:640px){.chips .grp{display:none}.secsel{display:block}}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600}
.chip small{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--accent)}

main .wrap{padding-block:12px 48px}

/* Topic view */
.sec-head{display:grid;gap:6px;padding-block:10px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sec-head h2{font-size:clamp(1.4rem,3.6vw,1.85rem);font-weight:800}
.sec-head p{margin:0;color:var(--muted);max-width:65ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.blk{padding-block:16px;border-bottom:1px solid var(--line)}
.blk:last-of-type{border-bottom:0}
.blk h3{font-size:1.05rem;font-weight:600;margin-bottom:8px}
.blk p{margin:0 0 6px;max-width:68ch}
.blk ul,.blk ol{margin:0;padding-left:1.25rem;display:grid;gap:4px;max-width:70ch}
.blk li::marker{color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg)}
td:first-child{font-weight:600;white-space:nowrap}
.note{margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.86rem;color:var(--ink)}

/* Flashcards */
.deckbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:10px}
.deckbar .count{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px clamp(18px,4vw,30px);min-height:240px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 0 var(--line)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted)}
.card .meta span:first-child{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card .q{font-family:var(--font-display);font-weight:600;font-size:clamp(1.15rem,3vw,1.4rem);line-height:1.35;text-wrap:balance}
.card .a{border-top:1px dashed var(--line);padding-top:14px;font-size:1.05rem;font-weight:600;color:var(--accent);animation:fade .25s ease}
.card .grow{flex:1}
.card .known{font-size:.78rem;color:var(--good);font-weight:700}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card-actions .btn{padding:12px}
.reveal{width:100%;padding:12px}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px clamp(18px,4vw,30px);display:grid;gap:14px}
.panel h2{font-size:1.35rem}
.panel p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.opt .k{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);min-width:1.2em;padding-top:2px}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{font-weight:700}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.score{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1;color:var(--accent)}
.score small{font-size:1.2rem;color:var(--muted)}
.wrong{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wrong li{padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.9rem}
.wrong li b{display:block;color:var(--good);margin-top:2px}
.qprog{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.85rem}
.stat b{display:block;font-family:var(--font-mono);font-size:1rem;color:var(--ink)}
.stat span{color:var(--muted)}

footer .wrap{padding-block:0 36px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<header>

    {q:"DeLorme yöntemi nasıl uygulanır?",a:"10 TM'nin %50, %75, %100'ü ile 3 set 10 tekrar",d:["10 TM'nin %100, %75, %50'si ile 3 set 10 tekrar","Her sette 1 TM ile tek tekrar","10 TM'nin %25, %50, %75'i ile 3 set 10 tekrar"]},
    {q:"McKenzie yaklaşımında iyi prognoz göstergesi hangisidir?",a:"Santralizasyon",d:["Periferalizasyon","Ağrının bacağa yayılması","Hareketle artan uyuşma"]},
    {q:"Sabit açısal hızda yapılan egzersiz hangisidir?",a:"İzokinetik",d:["İzotonik","İzometrik","Pliometrik"]},
    {q:"Kaltenborn III. derece nedir?",a:"Germe",d:["Gevşetme","Gevşekliği alma","Manipülasyon"]}
  ]},
{ id:"elk", tag:"Rehabilitasyon", title:"Elektroterapi ve Fiziksel Ajanlar",
  lead:"Sıcak ve soğuk uygulamalar, terapötik ultrason, elektrik akımları ve kontrendikasyonlar.",
  blocks:[
    {h:"Sıcak ve soğuk", ul:["<b>Hot pack:</b> yaklaşık 20 dakika; yüzeyel ısıtma (yaklaşık 1 cm). Vazodilatasyon, ağrıda azalma, kollajen esnekliğinde artış","<b>Parafin:</b> özellikle el ve el bileğinin kronik eklem tutukluğunda","<b>Kriyoterapi:</b> yaklaşık 10–20 dakika; akut inflamasyon ve ödemde. Kontrendikasyonlar: Raynaud fenomeni, soğuk ürtikeri, kriyoglobulinemi"]},
    {h:"Terapötik ultrason", ul:["<b>1 MHz:</b> derin dokular (yaklaşık 3–5 cm)","<b>3 MHz:</b> yüzeyel dokular (yaklaşık 1–2 cm)","<b>Sürekli mod:</b> termal etki; <b>pulse mod:</b> non-termal (mekanik) etki"]},
    {h:"Elektrik akımları", ul:["<b>Konvansiyonel TENS:</b> yüksek frekans (yaklaşık 50–100 Hz), duyusal düzey; kapı kontrol teorisi","<b>Akupunktur benzeri TENS:</b> düşük frekans (yaklaşık 2–10 Hz), motor düzey; endojen opioid salınımı","<b>İnterferansiyel akım:</b> iki orta frekanslı akımın kesişmesiyle derinde düşük frekanslı etki oluşur","<b>NMES:</b> kas kuvvetlendirme; <b>FES:</b> fonksiyonel aktivite sırasında, ör. düşük ayakta","<b>Kısa dalga diatermi:</b> derin ısıtma; metal implant ve kalp pilinde kontrendike"]},
    {h:"Genel kontrendikasyonlar (elektroterapi ve derin ısıtma)", ul:["Kalp pili (özellikle göğüs bölgesine yakın uygulama)","Gebelikte abdomen ve bel bölgesi","Malignite üzerine uygulama","Derin ven trombozu","Karotis sinüs ve gözler üzerine uygulama","Açık yara ve enfeksiyon; duyu kaybında dikkat"]}
  ],
  cards:[
    {q:"Derin dokular için hangi ultrason frekansı seçilir?",a:"1 MHz",d:["3 MHz","10 MHz","100 Hz"]},
    {q:"Pulse ultrasonun amacı nedir?",a:"Non-termal (mekanik) etki",d:["Derin ısıtma","Kas kasılması oluşturmak","Sinir iletimini bloke etmek"]},
    {q:"Konvansiyonel TENS hangi mekanizma ile ağrıyı azaltır?",a:"Kapı kontrol teorisi",d:["Endojen opioid salınımı","Kas hipertrofisi","Derin ısıtma"]},
    {q:"Düşük frekanslı (akupunktur benzeri) TENS'in mekanizması nedir?",a:"Endojen opioid salınımı",d:["Kapı kontrol teorisi","Vazokonstriksiyon","Kollajen sentezi"]},
    {q:"Hangisi soğuk uygulamanın kontrendikasyonudur?",a:"Raynaud fenomeni",d:["Akut ayak bileği burkulması","Akut ödem","Akut kas zorlanması"]},
    {q:"Hot pack genellikle ne kadar süre uygulanır?",a:"Yaklaşık 20 dakika",d:["2–3 dakika","60 dakika","2 saat"]},
    {q:"Kısa dalga diatermide önemli kontrendikasyon hangisidir?",a:"Metal implant ve kalp pili",d:["Kronik bel ağrısı","Kas spazmı","Eklem sertliği"]},
    {q:"İnterferansiyel akım nedir?",a:"İki orta frekanslı akımın kesişmesiyle oluşan düşük frekanslı etki",d:["Tek bir düşük frekanslı doğru akım","Ses dalgalarıyla ısıtma","Elektromanyetik dalgalarla ısıtma"]},
    {q:"Düşük ayakta yürüme sırasında hangi yöntem kullanılır?",a:"FES (fonksiyonel elektrik stimülasyonu)",d:["Konvansiyonel TENS","Hot pack","Terapötik ultrason"]},
    {q:"Parafin en çok hangi durumda kullanılır?",a:"El ve el bileğinin kronik eklem tutukluğu",d:["Akut yanık","Açık yara","Akut derin ven trombozu"]}
  ]}
);
const ORDER = ["ust","alt","omr","kas","plx","fiz","sol","kal","egz","kin","yur","ort","nor","kpr","ped","rom","man","elk","deg"];
SECTIONS.sort((a,b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
const GROUPS = ["Anatomi","Fizyoloji","Kinezyoloji","Rehabilitasyon","Değerlendirme"];

/* ---------- storage (per browser, optional) ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let known = store.get("ftr-known", {});
let best = store.get("ftr-best", {});
const ALL = SECTIONS.flatMap(s => s.cards.map((c,i) => ({...c, sid:s.id, key:s.id+":"+i})));
const secById = id => SECTIONS.find(s => s.id === id);

/* ---------- state ---------- */
const state = { view:"konular", sec:store.get("ftr-sec","ust"), onlyUnknown:false, deck:[], idx:0, revealed:false, deckSig:"" };
let quiz = { phase:"start", qs:[], i:0, picked:null, wrong:[], correct:0 };
const $ = s => document.querySelector(s);
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

function knownCount(sid){ const list = sid==="all" ? ALL : ALL.filter(c=>c.sid===sid); return list.filter(c=>known[c.key]).length; }
function poolFor(sid){ return sid==="all" ? ALL : ALL.filter(c=>c.sid===sid); }

/* ---------- header ---------- */
function renderTotal(){
  const k = knownCount("all");
  $("#totalText").textContent = k + " / " + ALL.length;
  $("#totalBar").style.width = (k/ALL.length*100) + "%";
}

/* ---------- chips ---------- */
function renderChips(){
  const withAll = state.view !== "konular";
  if(!secById(state.sec) && !(withAll && state.sec==="all")) state.sec = SECTIONS[0].id;
  const chip = s => `<button class="chip" data-sec="${s.id}" aria-pressed="${state.sec===s.id}">${s.title}<small>${knownCount(s.id)}/${poolFor(s.id).length}</small></button>`;
  let html = "";
  if(withAll) html += `<div class="grp"><span class="glabel">Karışık</span>${chip({id:"all", title:"Tümü"})}</div>`;
  for(const g of GROUPS){
    const list = SECTIONS.filter(s => s.tag===g);
    if(list.length) html += `<div class="grp"><span class="glabel">${g}</span>${list.map(chip).join("")}</div>`;
  }
  html += `<select class="secsel" id="secSelect" aria-label="Bölüm seç">`
    + (withAll ? `<option value="all" ${state.sec==="all"?"selected":""}>Tümü (${knownCount("all")}/${ALL.length})</option>` : "")
    + GROUPS.map(g => { const list = SECTIONS.filter(s => s.tag===g); return list.length ? `<optgroup label="${g}">${list.map(s => `<option value="${s.id}" ${state.sec===s.id?"selected":""}>${s.title} (${knownCount(s.id)}/${s.cards.length})</option>`).join("")}</optgroup>` : ""; }).join("")
    + `</select>`;
  $("#chips").innerHTML = html;
}
function setSec(id){
  state.sec = id; store.set("ftr-sec", id);
  if(state.view==="test") quiz = { phase:"start", qs:[], i:0, picked:null, wrong:[], correct:0 };
  render();
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-sec]"); if(b) setSec(b.dataset.sec);
});
$("#chips").addEventListener("change", e => {
  if(e.target.id==="secSelect") setSec(e.target.value);
});

/* ---------- topics ---------- */
function blockHTML(b){
  let h = `<section class="blk"><h3>${b.h}</h3>`;
  if(b.p) h += `<p>${b.p}</p>`;
  if(b.ul) h += `<ul>${b.ul.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.ol) h += `<ol>${b.ol.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  if(b.table) h += `<div class="tw"><table><thead><tr>${b.table.head.map(x=>`<th scope="col">${x}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return h + `</section>`;
}
function renderTopics(){
  const s = secById(state.sec);
  const k = knownCount(s.id);
  $("#view").innerHTML = `
    <div class="sec-head">
      <span class="eyebrow">${s.tag}</span>
      <h2>${s.title}</h2>
      <p>${s.lead}</p>
      <div class="actions">
        <button class="btn primary" data-go="kartlar">Kartlarla çalış</button>
        <button class="btn" data-go="test">Bu bölümün testini çöz</button>
        <span class="mono" style="align-self:center;color:var(--muted);font-size:.85rem">Bildiğin: ${k}/${s.cards.length}</span>
      </div>
    </div>
    ${s.blocks.map(blockHTML).join("")}
    <div class="note">Bu bölümde ${s.cards.length} kart var. Kartları çalıştıktan sonra testle kendini dene.</div>`;
}

/* ---------- flashcards ---------- */
function buildDeck(){
  let list = poolFor(state.sec);
  if(state.onlyUnknown) list = list.filter(c=>!known[c.key]);
  state.deck = shuffle(list); state.idx = 0; state.revealed = false;
  state.deckSig = state.sec + "|" + state.onlyUnknown;
}
function renderCards(){
  if(state.deckSig !== state.sec + "|" + state.onlyUnknown) buildDeck();
  const d = state.deck, i = state.idx;
  const bar = `<div class="deckbar">
      <label class="toggle"><input type="checkbox" id="onlyUnknown" ${state.onlyUnknown?"checked":""}> Sadece bilmediklerim</label>
      <span class="count">${Math.min(i+1,d.length)} / ${d.length}</span>
    </div>`;
  if(d.length===0){
    $("#view").innerHTML = bar + `<div class="panel"><h2>Bu bölümdeki tüm kartları biliyorsun</h2><p>“Sadece bilmediklerim” filtresini kapatıp tekrar edebilir ya da teste geçebilirsin.</p><div class="actions"><button class="btn primary" data-go="test">Teste geç</button></div></div>`;
    return;
  }
  if(i >= d.length){
    const k = d.filter(c=>known[c.key]).length;
    $("#view").innerHTML = bar + `<div class="panel"><h2>Desteyi bitirdin</h2><p>Bu destede bildiğin kart: <b class="mono">${k} / ${d.length}</b></p>
      <div class="actions"><button class="btn primary" id="restart">Karıştırıp baştan başla</button><button class="btn" id="unknownOnly">Bilmediklerimi çalış</button><button class="btn" data-go="test">Teste geç</button></div></div>`;
    return;
  }
  const c = d[i], s = secById(c.sid);
  $("#view").innerHTML = bar + `
    <article class="card" aria-live="polite">
      <div class="meta"><span>${s.title}</span>${known[c.key]?'<span class="known">Biliyorsun</span>':''}</div>
      <div class="q">${c.q}</div>
      <div class="grow"></div>
      ${state.revealed ? `<div class="a">${c.a}</div>` : `<button class="btn primary reveal" id="reveal">Cevabı göster</button>`}
    </article>
    <div class="card-actions">
      <button class="btn bad" id="again" ${state.revealed?"":"disabled"}>Tekrar et</button>
      <button class="btn good" id="gotit" ${state.revealed?"":"disabled"}>Biliyorum</button>
    </div>`;
}
function mark(isKnown){
  const c = state.deck[state.idx];
  if(isKnown) known[c.key] = true; else delete known[c.key];
  store.set("ftr-known", known);
  state.idx++; state.revealed = false; render();
}

/* ---------- quiz ---------- */
function startQuiz(){
  const pool = poolFor(state.sec);
  const n = state.sec==="all" ? 20 : pool.length;
  quiz = { phase:"q", i:0, picked:null, wrong:[], correct:0,
    qs: shuffle(pool).slice(0,n).map(c => ({...c, opts: shuffle([c.a, ...c.d])})) };
  render();
}
function renderQuiz(){
  const label = state.sec==="all" ? "Tüm bölümler" : secById(state.sec).title;
  if(quiz.phase==="start"){
    const n = state.sec==="all" ? 20 : poolFor(state.sec).length;
    const b = best[state.sec];
    $("#view").innerHTML = `<div class="panel">
      <span class="eyebrow">Test</span>
      <h2>${label}</h2>
      <p>${n} soru, her soruda tek doğru cevap. Cevabı seçince doğrusu hemen gösterilir.</p>
      <div class="stats">
        <div class="stat"><span>Soru sayısı</span><b>${n}</b></div>
        <div class="stat"><span>En iyi skorun</span><b>${b ? b.c+" / "+b.n : "Henüz yok"}</b></div>
      </div>
      <div class="actions"><button class="btn primary" id="startQuiz">Testi başlat</button></div>
    </div>`;
    return;
  }
  if(quiz.phase==="end"){
    const n = quiz.qs.length;
    $("#view").innerHTML = `<div class="panel">
      <span class="eyebrow">Sonuç · ${label}</span>
      <div class="score">${quiz.correct}<small> / ${n}</small></div>
      <p>${quiz.correct===n ? "Hepsi doğru. Başka bir bölüme geçebilirsin." : "Yanlış yaptığın sorular aşağıda, doğru cevaplarıyla birlikte."}</p>
      ${quiz.wrong.length ? `<ul class="wrong">${quiz.wrong.map(w=>`<li>${w.q}<b>${w.a}</b></li>`).join("")}</ul>` : ""}
      <div class="actions"><button class="btn primary" id="startQuiz">Yeniden çöz</button><button class="btn" data-go="kartlar">Kartlara dön</button></div>
    </div>`;
    return;
  }
  const q = quiz.qs[quiz.i], answered = quiz.picked!==null;
  const letters = "ABCD";
  $("#view").innerHTML = `<div class="panel">
    <div class="qprog"><span>${label}</span><span class="mono">Soru ${quiz.i+1} / ${quiz.qs.length} · Doğru ${quiz.correct}</span></div>
    <div class="bar"><i style="width:${(quiz.i/quiz.qs.length)*100}%"></i></div>
    <h2>${q.q}</h2>
    <div class="opts">${q.opts.map((o,j)=>{
      let cls = "opt";
      if(answered && o===q.a) cls += " ok";
      else if(answered && j===quiz.picked) cls += " no";
      return `<button class="${cls}" data-opt="${j}" ${answered?"disabled":""}><span class="k">${letters[j]}</span><span>${o}</span></button>`;
    }).join("")}</div>
    ${answered ? `<div class="feedback ${q.opts[quiz.picked]===q.a?"ok":"no"}">${q.opts[quiz.picked]===q.a?"Doğru.":"Yanlış. Doğru cevap: "+q.a}</div>
      <div class="actions"><button class="btn primary" id="nextQ">${quiz.i+1<quiz.qs.length?"Sonraki soru":"Sonucu gör"}</button></div>` : ""}
  </div>`;
}
function pick(j){
  if(quiz.picked!==null) return;
  const q = quiz.qs[quiz.i]; quiz.picked = j;
  if(q.opts[j]===q.a) quiz.correct++; else quiz.wrong.push(q);
  render();
}
function nextQ(){
  quiz.i++; quiz.picked = null;
  if(quiz.i >= quiz.qs.length){
    quiz.phase = "end";
    const prev = best[state.sec];
    if(!prev || quiz.correct/quiz.qs.length > prev.c/prev.n){ best[state.sec] = {c:quiz.correct, n:quiz.qs.length}; store.set("ftr-best", best); }
  }
  render();
}

/* ---------- events ---------- */
$("#view").addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.go){ location.hash = t.dataset.go; return; }
  if(t.dataset.opt !== undefined){ pick(+t.dataset.opt); return; }
  switch(t.id){
    case "reveal": state.revealed = true; render(); break;
    case "again": mark(false); break;
    case "gotit": mark(true); break;
    case "restart": buildDeck(); render(); break;
    case "unknownOnly": state.onlyUnknown = true; buildDeck(); render(); break;
    case "startQuiz": startQuiz(); break;
    case "nextQ": nextQ(); break;
  }
});
$("#view").addEventListener("change", e => {
  if(e.target.id==="onlyUnknown"){ state.onlyUnknown = e.target.checked; buildDeck(); render(); }
});
document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea")) return;
  if(state.view==="kartlar" && state.idx < state.deck.length){
    if(e.code==="Space" && !state.revealed){ e.preventDefault(); state.revealed = true; render(); }
    else if(state.revealed && e.key==="ArrowRight"){ mark(true); }
    else if(state.revealed && e.key==="ArrowLeft"){ mark(false); }
  }
  if(state.view==="test" && quiz.phase==="q"){
    const n = "1234".indexOf(e.key); if(n>-1 && n < quiz.qs[quiz.i].opts.length) pick(n);
    if(e.key==="Enter" && quiz.picked!==null) nextQ();
  }
});

/* ---------- routing ---------- */
function render(){
  document.querySelectorAll(".tabs a").forEach(a => { if(a.dataset.v===state.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderTotal(); renderChips();
  if(state.view==="konular") renderTopics();
  else if(state.view==="kartlar") renderCards();
  else renderQuiz();
}
function route(){
  const h = location.hash.slice(1);
  const v = ["konular","kartlar","test"].includes(h) ? h : "konular";
  if(v !== state.view && v==="test") quiz = { phase:"start", qs:[], i:0, picked:null, wrong:[], correct:0 };
  state.view = v; render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>

</html>
